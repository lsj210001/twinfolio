[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinfolio"
dynamic = ["version"]
description = "English EPUB in. Facing-page Chinese out."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dtbllsj", email = "dtbllsj@gmail.com" }]
keywords = ["epub", "translation", "bilingual", "chinese", "english", "llm", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "beautifulsoup4>=4.13",
  "lxml>=5.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/lsj210001/twinfolio"
Repository = "https://github.com/lsj210001/twinfolio"
Issues = "https://github.com/lsj210001/twinfolio/issues"
Changelog = "https://github.com/lsj210001/twinfolio/blob/main/CHANGELOG.md"

[project.scripts]
twinfolio = "book_translate.cli:main"
book-translate = "book_translate.cli:main"

[tool.setuptools.dynamic]
version = { attr = "book_translate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_translate = ["prompts/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
  # Permanent: fullwidth CJK punctuation in strings/comments/docstrings is
  # intentional (Chinese output), not a confusable-character mistake.
  "RUF001",
  "RUF002",
  "RUF003",
  # Temporary: pre-existing violations, to be removed in a dedicated cleanup
  # PR (`ruff check --fix` + `ruff format`). Do not add new code that trips
  # these rules.
  "B007",    # unused-loop-control-variable (1)
  "B905",    # zip-without-explicit-strict (2)
  "C416",    # unnecessary-comprehension (1)
  "E501",    # line-too-long (25)
  "I001",    # unsorted-imports (4)
  "PIE810",  # multiple-starts-ends-with (4)
  "RUF005",  # collection-literal-concatenation (1)
  "RUF100",  # unused-noqa (5)
  "SIM102",  # collapsible-if (1)
  "SIM103",  # needless-bool (3)
  "SIM105",  # suppressible-exception (2)
  "SIM108",  # if-else-block-instead-of-if-exp (1)
  "SIM109",  # compare-with-tuple (1)
  "SIM115",  # open-file-with-context-handler (1)
  "UP017",   # datetime-timezone-utc (2)
  "UP035",   # deprecated-import (3)
  "UP037",   # quoted-annotation (1)
  "UP045",   # non-pep604-annotation-optional (4)
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# Temporary: these modules carry 12 pre-existing type errors (Windows-only
# msvcrt attrs, bs4 attribute unions, a reused local variable). They will be
# fixed in a dedicated cleanup PR; new modules must type-check.
[[tool.mypy.overrides]]
module = [
  "book_translate._util",
  "book_translate.file_resume",
  "book_translate.llm",
  "book_translate.toc_repair",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
precision = 1
